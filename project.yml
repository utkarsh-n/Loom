name: Loom
options:
  bundleIdPrefix: com.utkarsh
  deploymentTarget:
    iOS: "27.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
packages:
  LoomEngine:
    path: LoomEngine
  OfflineIntelligenceKit:
    path: ../OfflineIntelligenceKit
  OfflineIntelligenceMLX:
    path: ../OfflineIntelligenceKit/MLX
  # Qwen3 on the GPU: the same pinned versions as the AttentionMachine app.
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.32.3
  MLXSwift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: 0.32.3
  Transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.0
  Collections:
    url: https://github.com/apple/swift-collections
    exactVersion: 1.5.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Loom:
    type: application
    platform: iOS
    sources:
      - path: Loom
        excludes: ["Resources/Model", "Resources/Qwen", "Resources/Models"]
      - path: Loom/Resources/Model
        type: folder
        buildPhase: resources
      # Qwen3-4B's weights, tokenizer and Mac-side extras; Tools/build.sh fills it for device builds.
      - path: Loom/Resources/Qwen
        type: folder
        buildPhase: resources
      - path: Loom/Resources/Models
        type: folder
        buildPhase: resources
    dependencies:
      - package: LoomEngine
      - package: OfflineIntelligenceKit
        product: OfflineIntelligence
      - package: OfflineIntelligenceMLX
        product: OfflineIntelligenceMLX
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwift
        product: MLX
      - package: MLXSwift
        product: MLXNN
      - package: Transformers
        product: Tokenizers
    info:
      path: Loom/Info.plist
      properties:
        CFBundleDisplayName: Loom
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.education
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.utkarsh.loom
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -DACCELERATE_NEW_LAPACK"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: Loom/Loom.entitlements
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    entitlements:
      path: Loom/Loom.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
